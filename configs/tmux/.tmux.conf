set -g extended-keys on
bind-key -n S-Enter send-keys -l "\e[13;2u"

set -g mouse on
set -g status-interval 1
set -g prefix C-a
unbind C-b
set -g default-command "printf '\\033[5 q'; exec $SHELL"
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ── Palette (Tokyo Night) ─────────────────────────────────────────────────
# bar #1a1b26  ·  fg #a9b1d6  ·  dim #565f89  ·  chip #292e42  ·  line #3b4261
# blue #7aa2f7 · cyan #7dcfff · green #9ece6a · yellow #e0af68
# orange #ff9e64 · purple #bb9af7 · red #f7768e
set -g status-style bg=#1a1b26,fg=#a9b1d6
set -g message-style bg=#1a1b26,fg=#7aa2f7

# ── Left: rounded session pill (blue; red while prefix is held) ───────────
set -g status-left "#[fg=#{?client_prefix,#f7768e,#7aa2f7},bg=#1a1b26]#[fg=#1a1b26,bg=#{?client_prefix,#f7768e,#7aa2f7}]  #S #[fg=#{?client_prefix,#f7768e,#7aa2f7},bg=#1a1b26]#[fg=#a9b1d6,bg=#1a1b26]"
set -g status-left-length 40

# ── Right: throttled chip modules, then a date + clock pill ───────────────
# Each module prints its own rounded chip, so idle ones simply vanish.
set -g status-right "#{?#{m/r:^(opencode|claude|codex),#{pane_current_command}},#(~/.tmux-cache 1 agent-#{pane_pid} ~/.tmux-agent #{pane_pid}),}#(~/.tmux-cache 10 cputemp ~/.tmux-cputemp)#(~/.tmux-cache 5 stats ~/.tmux-stats)#(~/.tmux-cache 30 battery ~/.tmux-battery)#(~/.tmux-cache 5 nowplaying ~/.tmux-nowplaying)#[fg=#7aa2f7,bg=#1a1b26] #[fg=#1a1b26,bg=#7aa2f7] %a %d %b  %H:%M #[fg=#7aa2f7,bg=#1a1b26] #[fg=#a9b1d6,bg=#1a1b26]"
set -g status-right-length 200

# ── Windows: program icon + activity/bell/zoom glyphs ─────────────────────
# Icon is derived from pane_current_command (kept in-format so it forks nothing).
# Window formats (per-CLI icons) are generated from the table in ~/.tmux-icons.
run-shell '~/.tmux-icons'
set -g window-status-separator ""

# Pane borders
set -g pane-border-style fg=#3b4261
set -g pane-active-border-style fg=#7aa2f7
set -g display-panes-colour "#7aa2f7"
set -g display-panes-active-colour "#f7768e"

# Pane colors
set -g clock-mode-colour "#7aa2f7"
set -g copy-mode-match-style bg=#7aa2f7,fg=#1a1b26
